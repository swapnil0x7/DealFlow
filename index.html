<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply appearance before styles and application modules paint, including loading/error states.
      ;(() => {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('dealdesk:theme')
          if (saved === 'light' || saved === 'dark') preference = saved
        } catch {}
        const resolved =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference
        const root = document.documentElement
        root.dataset.theme = resolved
        root.dataset.agThemeMode = resolved
        root.dataset.themePreference = preference
        root.style.colorScheme = resolved
      })()
    </script>
    <meta name="description" content="DealDesk sales pipeline workspace" />
    <title>DealDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
